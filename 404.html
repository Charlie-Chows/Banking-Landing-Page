<!-- ============ 404.html ============ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly </title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/404.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-illustration fade-in">
                <div class="error-circle">🔍</div>
            </div>
            <h1 class="error-code fade-up">
                4<span>0</span>4
            </h1>
            <div class="error-divider"></div>
            <h2 class="error-title fade-up delay-1">Page Not Found</h2>
            <p class="error-message fade-up delay-2">
                Oops! The page you're looking for doesn't exist or has been moved.
                <br>Let's get you back on track.
            </p>
            <a href="index.html" class="error-btn fade-up delay-3">
                ← Back to Homepage
            </a>
        </div>
    </div>
    <script>
        // Simple fade-in on load
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up, .fade-in').forEach((el, i) => {
                setTimeout(() => {
                    el.classList.add('visible');
                }, i * 150);
            });
        });
    </script>
</body>
</html>
