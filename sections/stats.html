<!-- ============ stats ============ -->
<section class="stats-section" id="section-stats">
    <div class="container">
        <div class="stats-grid">
            <div class="stat-item fade-up delay-1">
                <div class="stat-number">
                    <span class="count-up" data-target="5000000">0</span>
                    <span class="suffix">+</span>
                </div>
                <div class="stat-label">Active Customers</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item fade-up delay-2">
                <div class="stat-number">
                    <span>$</span>
                    <span class="count-up" data-target="50">0</span>
                    <span class="suffix">B+</span>
                </div>
                <div class="stat-label">Assets Managed</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item fade-up delay-3">
                <div class="stat-number">
                    <span class="count-up" data-target="99.9">0</span>
                    <span class="suffix">%</span>
                </div>
                <div class="stat-label">Platform Uptime</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item fade-up delay-4">
                <div class="stat-number">
                    <span class="count-up" data-target="40">0</span>
                    <span class="suffix">+</span>
                </div>
                <div class="stat-label">Countries Served</div>
            </div>
        </div>
    </div>
</section>
